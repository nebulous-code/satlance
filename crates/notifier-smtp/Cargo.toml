[package]
name = "notifier-smtp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Sat Surveillance SMTP notifier: a stateless egress client of the published outbox contract. Pulls, emails, acks. Issues no verbs."
license = "MIT"

[[bin]]
name = "satsurv-notifier-smtp"
path = "src/main.rs"

[dependencies]
ureq = { version = "=2.9.7", default-features = false, features = ["json"] }
serde_json = "=1.0.117"
